{% extends "global/base.html" %}

{% block title %}Inscription - GreenCheck{% endblock %}

{% block content %}

<div class="form-container">
    <h2 style="text-align: center;">Créer un compte</h2>

    <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" name="lastname" required>
        </div>

        <div class="from-group">
            <label for="fistname">Prénom</label>
            <input type="text" id="fistname" name="firstname" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirmer le mot de passe</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">
        Déjà un compte ?
        <a href="{% url 'login' %}">Connectez-vous</a>
    </p>
</div>

{% endblock %}
